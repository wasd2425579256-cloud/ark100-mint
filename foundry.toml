[profile.default]
src = "src"
test = "test/market"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# The older Ark100.t.sol imports TicketNFT / ArkToken / mocks that are not published in this repo.
# `forge test` runs test/market only. Those sources stay on the deployed contracts.
